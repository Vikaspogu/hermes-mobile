<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <title>I.V.A.N Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fa; color: #14171c; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      .mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 18px; }
      p { color: #5b626d; line-height: 1.45; }
      button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 999px; background: #3b5bdb; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:active { transform: scale(0.98); }
      @media (prefers-color-scheme: dark) { body { background: #0e1116; color: #e6e9ee; } p { color: #9aa3b0; } }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./icons/icon-192.png" alt="" />
      <h1>I.V.A.N is offline</h1>
      <p>The app shell is available, but Hermes data needs a network connection to your Dashboard.</p>
      <button onclick="location.reload()">Refresh app</button>
    </main>
  </body>
</html>
